  <circle cx="152.3" cy="99.8" r="8.5" fill="#9558B2"/>
  <circle cx="225" cy="62" r="8.5" fill="#4063D8"/>
  <circle cx="249.2" cy="44.4" r="8.5" fill="#CB3C33"/>
  <circle cx="227.2" cy="121.4" r="8.5" fill="#389826"/>
  <circle cx="248.3" cy="99.8" r="8.5" fill="#9558B2"/>
  <!-- time arrow -->
  <use href="#arrow" fill="none" stroke="#FFFFFF" stroke-width="4.4" mask="url(#outside)"/>
  <use href="#arrow" fill="none" stroke="#1A1A1A" stroke-width="2.4"/>
