<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 312 206" width="312" height="206">
  <title>TemporalGraphs.jl</title>
  <!-- black outlines with a thin white border outside, readable on light and dark backgrounds -->
  <defs>
    <g id="snapshots" stroke-linejoin="round">
      <polygon points="15.4,30.1 72.6,1.5 72.6,137.9 15.4,166.5"/>
      <polygon points="111.4,30.1 168.6,1.5 168.6,137.9 111.4,166.5"/>
      <polygon points="207.4,30.1 264.6,1.5 264.6,137.9 207.4,166.5"/>
    </g>
    <g id="edges" stroke-linecap="round">
      <line x1="33" y1="62" x2="57.2" y2="44.4"/>
      <line x1="33" y1="62" x2="35.2" y2="121.4"/>
      <line x1="129" y1="62" x2="131.2" y2="121.4"/>
      <line x1="153.2" y1="44.4" x2="152.3" y2="99.8"/>
      <line x1="129" y1="62" x2="152.3" y2="99.8"/>
      <line x1="225" y1="62" x2="249.2" y2="44.4"/>
      <line x1="249.2" y1="44.4" x2="248.3" y2="99.8"/>
    </g>
    <path id="arrow" d="M14 178.5 H252 V170 L274 182 L252 194 V185.5 H14 Z" stroke-linejoin="round"/>
    <!-- everything outside the snapshots and the arrow: their white border is drawn only there -->
    <mask id="outside" maskUnits="userSpaceOnUse" x="0" y="-6" width="312" height="206">
      <rect x="0" y="-6" width="312" height="206" fill="#FFFFFF"/>
      <use href="#snapshots" fill="#000000"/>
      <use href="#arrow" fill="#000000"/>
    </mask>
  </defs>
  <!-- snapshots -->
  <use href="#snapshots" fill="none" stroke="#FFFFFF" stroke-width="4.4" mask="url(#outside)"/>
  <use href="#snapshots" fill="none" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- each node through time: the nodes are the same in every snapshot -->
  <g stroke="#8C8C8C" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round">
    <line x1="33" y1="62" x2="225" y2="62"/>
    <line x1="57.2" y1="44.4" x2="249.2" y2="44.4"/>
    <line x1="35.2" y1="121.4" x2="227.2" y2="121.4"/>
    <line x1="56.3" y1="99.8" x2="248.3" y2="99.8"/>
  </g>
  <!-- edges of each snapshot, in a grey readable on any background -->
  <use href="#edges" stroke="#707070" stroke-width="3.5"/>
  <!-- nodes in the Julia colors (isolated in a snapshot when they have no edges there) -->
  <circle cx="33" cy="62" r="8.5" fill="#4063D8"/>
  <circle cx="57.2" cy="44.4" r="8.5" fill="#CB3C33"/>
  <circle cx="35.2" cy="121.4" r="8.5" fill="#389826"/>
  <circle cx="56.3" cy="99.8" r="8.5" fill="#9558B2"/>
