<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330">
  <title>Temporal graph of the quick example</title>
  <!-- the edges (u, v, t, tt) of the quick example in index.md, labelled with (t, tt);
       grey edges and haloed labels, readable on light and dark backgrounds -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4.4" markerHeight="4.4"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#707070"/>
    </marker>
  </defs>
  <!-- edges -->
  <g fill="none" stroke="#707070" stroke-width="2.5" marker-end="url(#head)">
    <path d="M104.1,75.9 Q240,10 375.9,75.9"/>   <!-- (1, 2, 2, 1) -->
    <path d="M110,90 L370,90"/>                  <!-- (1, 2, 5, 2) -->
    <path d="M90,110 L90,230"/>                  <!-- (1, 4, 1, 5) -->
    <path d="M390,230 L390,110"/>                <!-- (3, 2, 6, 1) -->
    <path d="M372.4,99.4 L107.6,240.6"/>         <!-- (2, 4, 7, 2) -->
    <path d="M110,250 L370,250"/>                <!-- (4, 3, 6, 2) -->
    <path d="M104.1,264.1 Q240,330 375.9,264.1"/> <!-- (4, 3, 8, 1) -->
  </g>
  <!-- edge labels (t, tt) -->
  <g font-family="Lato, Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A"
     stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="240" y="36" text-anchor="middle">(2, 1)</text>
    <text x="240" y="110" text-anchor="middle">(5, 2)</text>
    <text x="78" y="175" text-anchor="end">(1, 5)</text>
    <text x="402" y="175" text-anchor="start">(6, 1)</text>
    <text x="234" y="159" text-anchor="middle" transform="rotate(-28.07 234 159)">(7, 2)</text>
    <text x="240" y="242" text-anchor="middle">(6, 2)</text>
    <text x="240" y="315" text-anchor="middle">(8, 1)</text>
  </g>
  <!-- nodes in the Julia colors, as in the logo -->
  <circle cx="90" cy="90" r="20" fill="#4063D8"/>
  <circle cx="390" cy="90" r="20" fill="#CB3C33"/>
  <circle cx="390" cy="250" r="20" fill="#389826"/>
  <circle cx="90" cy="250" r="20" fill="#9558B2"/>
  <g font-family="Lato, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF"
     text-anchor="middle" dominant-baseline="central">
    <text x="90" y="90">1</text>
    <text x="390" y="90">2</text>
    <text x="390" y="250">3</text>
    <text x="90" y="250">4</text>
  </g>
</svg>
