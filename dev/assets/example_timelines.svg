<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 345" width="740" height="345">
  <title>Timelines of the temporal graph of the quick example</title>
  <!-- one timeline per node; each edge (u, v, t, tt) goes from u at time t to v at time t + tt.
       grey strokes and haloed labels, readable on light and dark backgrounds -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#707070"/>
    </marker>
  </defs>
  <!-- times -->
  <g stroke="#8C8C8C" stroke-width="1" stroke-opacity="0.45">
    <line x1="110" y1="30" x2="110" y2="280"/>
    <line x1="180" y1="30" x2="180" y2="280"/>
    <line x1="250" y1="30" x2="250" y2="280"/>
    <line x1="320" y1="30" x2="320" y2="280"/>
    <line x1="390" y1="30" x2="390" y2="280"/>
    <line x1="460" y1="30" x2="460" y2="280"/>
    <line x1="530" y1="30" x2="530" y2="280"/>
    <line x1="600" y1="30" x2="600" y2="280"/>
    <line x1="670" y1="30" x2="670" y2="280"/>
  </g>
  <path d="M80,300 H710" stroke="#707070" stroke-width="2" marker-end="url(#head)" fill="none"/>
  <g font-size="14" text-anchor="middle" font-family="Lato, Helvetica, Arial, sans-serif" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="110" y="322">1</text>
    <text x="180" y="322">2</text>
    <text x="250" y="322">3</text>
    <text x="320" y="322">4</text>
    <text x="390" y="322">5</text>
    <text x="460" y="322">6</text>
    <text x="530" y="322">7</text>
    <text x="600" y="322">8</text>
    <text x="670" y="322">9</text>
    <text x="722" y="305" text-anchor="start" font-style="italic">t</text>
  </g>
  <!-- each node through time -->
  <g stroke="#8C8C8C" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round">
    <line x1="80" y1="50" x2="700" y2="50"/>
    <line x1="80" y1="120" x2="700" y2="120"/>
    <line x1="80" y1="190" x2="700" y2="190"/>
    <line x1="80" y1="260" x2="700" y2="260"/>
  </g>
  <!-- edges -->
  <g stroke="#707070" stroke-width="2.5" fill="none" marker-end="url(#head)">
    <path d="M114.6,51.9 L455.4,188.1"/>   <!-- (1, 4, 1, 5) -->
    <path d="M183.5,53.5 L246.5,116.5"/>   <!-- (1, 2, 2, 1) -->
    <path d="M394.5,52.2 L525.5,117.8"/>   <!-- (1, 2, 5, 2) -->
    <path d="M462.2,255.5 L527.8,124.5"/>   <!-- (3, 2, 6, 1) -->
    <path d="M464.5,192.2 L595.5,257.8"/>   <!-- (4, 3, 6, 2) -->
    <path d="M534.5,122.2 L665.5,187.8"/>   <!-- (2, 4, 7, 2) -->
    <path d="M603.5,193.5 L666.5,256.5"/>   <!-- (4, 3, 8, 1) -->
  </g>
  <!-- departures and arrivals, in the color of their node -->
  <circle cx="110" cy="50" r="5" fill="#4063D8"/>
  <circle cx="180" cy="50" r="5" fill="#4063D8"/>
  <circle cx="250" cy="120" r="5" fill="#CB3C33"/>
  <circle cx="390" cy="50" r="5" fill="#4063D8"/>
  <circle cx="460" cy="260" r="5" fill="#389826"/>
  <circle cx="460" cy="190" r="5" fill="#9558B2"/>
  <circle cx="530" cy="120" r="5" fill="#CB3C33"/>
  <circle cx="600" cy="260" r="5" fill="#389826"/>
  <circle cx="600" cy="190" r="5" fill="#9558B2"/>
  <circle cx="670" cy="260" r="5" fill="#389826"/>
  <circle cx="670" cy="190" r="5" fill="#9558B2"/>
  <!-- nodes in the Julia colors, as in the logo -->
  <circle cx="35" cy="50" r="16" fill="#4063D8"/>
  <text x="35" y="50" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Lato, Helvetica, Arial, sans-serif">1</text>
  <circle cx="35" cy="120" r="16" fill="#CB3C33"/>
  <text x="35" y="120" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Lato, Helvetica, Arial, sans-serif">2</text>
  <circle cx="35" cy="190" r="16" fill="#9558B2"/>
  <text x="35" y="190" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Lato, Helvetica, Arial, sans-serif">4</text>
  <circle cx="35" cy="260" r="16" fill="#389826"/>
  <text x="35" y="260" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Lato, Helvetica, Arial, sans-serif">3</text>
</svg>
